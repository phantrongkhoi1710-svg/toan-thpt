  </head>
  <body>

          Toán THPT

        <nav>
          <p class="nav-group__label">Học tập</p>
          <ul class="nav-list">
            <li><a href="../index.html"><span class="ico">⌂</span> Trang chủ</a></li>
            <li><a href="slides.html"><span class="ico">▣</span> Slide Bài 3</a></li>
            <li><a class="is-active" href="bai-tap.html"><span class="ico">🎟</span> Rạp Nghiệm</a></li>
            <li><a href="../bai-1-menh-de/bai-tap.html"><span class="ico">1</span> Map Bài 1</a></li>

        <div class="sidebar__foot"><strong>Rạp Nghiệm</strong> Mỗi mốc là một suất chiếu thử thách. Đúng → nhận Vé Vàng (XP).</div>
      </aside>
      <div class="main-col">
        <header class="topbar">
          <button class="menu-toggle" id="menuToggle" type="button">☰</button>
          <label class="search"><span>⌕</span><input type="search" placeholder="Tìm suất chiếu..." /></label>
          <div class="topbar__actions">
            <a class="btn btn--ghost" href="slides.html">← Slide</a>
            <div class="avatar" style="background:linear-gradient(135deg,#fb923c,#e11d48)">HS</div>
          </div>
        </header>
        <main class="content">
          <div class="page-head" style="margin-bottom:0.75rem">
            <h1>Rạp Nghiệm</h1>
            <p>Challenge map Bài 3 — bất phương trình bậc nhất hai ẩn</p>
          </div>
          <div class="map-hud">
            <div class="map-stat">🎟 <strong id="xpVal">0</strong> <span>Vé Vàng</span></div>
            <div class="map-stat">★ <strong id="doneVal">0</strong><span>/<span id="totalVal">0</span></span></div>
            <div class="map-stat">🔥 <strong id="streakVal">0</strong> <span>chuỗi</span></div>
            <button type="button" class="btn btn--ghost" id="resetProgress">Chiếu lại từ đầu</button>
          </div>
          <div class="map-board map-board--cinema" id="mapBoard"></div>
        </main>
      </div>
    </div>
    <div class="challenge-overlay" id="challenge" aria-hidden="true">
      <div class="challenge-panel" role="dialog" aria-modal="true">
        <div class="challenge-panel__head">
          <h2 id="chTitle">Suất</h2>
          <button type="button" class="btn btn--ghost" id="chClose">Đóng</button>
        </div>
        <div class="challenge-panel__body" id="chBody"></div>
        <div class="challenge-panel__foot">
          <button type="button" class="btn btn--ghost" id="chSkip">Để sau</button>
          <button type="button" class="btn btn--primary" id="chCheck" style="background:linear-gradient(135deg,#f97316,#e11d48)">Kiểm tra</button>
        </div>
      </div>
    </div>
    <div class="map-toast" id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script>
      const LEVEL_LABEL = {1:"Định nghĩa",2:"Nghiệm",3:"Miền nghiệm",4:"Vận dụng"};
      const XP = {1:12,2:16,3:22,4:32};
      const KEY = "toan-thpt-cinema-bpt-v2";
      const bank = [
        {level:1,title:"Bù lỗ khi nào?",image:"../images/bai3/cinema.jpg",
          prompt:"Rạp bán vé loại 1 giá 50&nbsp;000 đồng và vé loại 2 giá 100&nbsp;000 đồng. Gọi \\(x,y\\) lần lượt là số vé loại 1 và loại 2 đã bán. Rạp <strong>bù lỗ</strong> khi doanh thu nhỏ hơn 20&nbsp;000&nbsp;000 đồng. Bất phương trình nào mô tả đúng điều kiện bù lỗ?",
          options:["\\(50000x+100000y=20000000\\)","\\(50000x+100000y&lt;20000000\\)","\\(x+y&lt;20\\)","\\(x&gt;y\\)"],answer:1,
          explain:"Doanh thu = \\(50000x+100000y\\). Bù lỗ ⟺ doanh thu &lt; 20 triệu ⟺ \\(50000x+100000y&lt;20000000\\). Dấu \\(=\\) chỉ là hòa vốn, không phải bù lỗ."},
        {level:1,title:"Dạng tổng quát",
          prompt:"Trong các khẳng định sau, khẳng định nào đúng về <strong>bất phương trình bậc nhất hai ẩn</strong>?",
          options:["Dạng \\(ax^2+by+c&lt;0\\) với \\(a\\ne0\\)","Dạng \\(ax+by+c&lt;0\\) (hoặc \\(&gt;,\\le,\\ge\\)), trong đó \\(a,b\\) không đồng thời bằng 0","Dạng \\(\\dfrac{a}{x}+by=0\\)","Dạng \\(\\sin x+y&gt;0\\)"],answer:1,
          explain:"Bậc nhất hai ẩn: mỗi ẩn có bậc tối đa 1, không có tích \\(xy\\) hay hàm lượng giác; \\(a\\) và \\(b\\) không cùng bằng 0."},
        {level:1,title:"Nhận biết dạng",
          prompt:"Biểu thức nào sau đây là bất phương trình bậc nhất hai ẩn?",
          options:["\\(2x-y+1&lt;0\\)","\\(x^2+y&lt;1\\)","\\(x+3=0\\)","\\(xy-2&gt;0\\)"],answer:0,
          explain:"A đúng dạng. B có \\(x^2\\) (bậc hai). C là phương trình một ẩn. D có tích \\(xy\\) nên không phải bậc nhất."},
        {level:2,title:"Nhận nghiệm",
          prompt:"Cho bất phương trình \\(x-2y+1&lt;0\\). Cặp số nào là một nghiệm của bất phương trình?",
          options:["\\((0;1)\\)","\\((0;0)\\)","\\((3;0)\\)","\\((2;-1)\\)"],answer:0,
          explain:"Thay lần lượt: A: \\(0-2+1=-1&lt;0\\) đúng. B: \\(1&lt;0\\) sai. C: \\(4&lt;0\\) sai. D: \\(2+2+1=5&lt;0\\) sai."},
        {level:2,title:"Số nghiệm",
          prompt:"Về số nghiệm của một bất phương trình bậc nhất hai ẩn, khẳng định nào đúng?",
          options:["Luôn có đúng một nghiệm \\((x_0;y_0)\\)","Luôn có đúng hai nghiệm","Luôn có vô số nghiệm (miền là nửa mặt phẳng)","Có thể vô nghiệm nếu hệ số âm"],answer:2,
          explain:"Đường thẳng biên chia mặt phẳng thành hai nửa; một nửa (có hoặc không kể bờ) gồm vô số điểm thỏa BPT."},
        {level:2,title:"Loại nghiệm giả",
          prompt:"Cho \\(2x-y-3\\ge0\\). Cặp nào <strong>không</strong> là nghiệm?",
          options:["\\((2;1)\\)","\\((3;3)\\)","\\((1;0)\\)","\\((0;-4)\\)"],answer:2,
          explain:"A: \\(4-1-3=0\\ge0\\) đúng (nằm trên bờ). B: \\(6-3-3=0\\ge0\\) đúng. C: \\(2-0-3=-1\\ge0\\) sai. D: \\(0+4-3=1\\ge0\\) đúng."},
        {level:3,title:"Miền nghiệm",image:"../images/bai3/halfplane.jpg",
          prompt:"Trên mặt phẳng tọa độ, miền nghiệm của bất phương trình bậc nhất hai ẩn là tập hợp nào?",
          options:["Một điểm duy nhất","Một đoạn thẳng hữu hạn","Một nửa mặt phẳng (có kể hoặc không kể đường biên, tùy dấu)","Toàn bộ mặt phẳng tọa độ"],answer:2,
          explain:"Bờ \\(ax+by+c=0\\) chia mặt phẳng thành hai nửa; miền nghiệm là đúng một nửa đó, có/không kể bờ tùy \\(\\le,\\ge\\) hay \\(&lt;,&gt;\\)."},
        {level:3,title:"Các bước vẽ miền",
          prompt:"Khi biểu diễn miền nghiệm của \\(ax+by+c&lt;0\\) trên mặt phẳng, thứ tự thao tác nào đúng?",
          options:["Tô màu trước, rồi mới vẽ đường thẳng biên","Vẽ đường thẳng biên → chọn điểm thử (không trên biên) → thay vào BPT → tô nửa mặt phẳng thỏa","Chỉ cần chọn điểm thử, không cần vẽ đường thẳng","Vẽ hai đường thẳng vuông góc rồi tô hình chữ nhật"],answer:1,
          explain:"Quy trình chuẩn SGK: vẽ bờ, thử một điểm, kết luận nửa mặt phẳng, nhớ dấu nghiêm ngặt thì không tô bờ."},
        {level:3,title:"Điểm thử gốc",
          prompt:"Đang tìm miền nghiệm của một BPT bậc nhất hai ẩn. Biết điểm \\(O(0;0)\\) <strong>không nằm trên biên</strong> và khi thay vào thì bất phương trình <strong>đúng</strong>. Kết luận nào đúng?",
          options:["Miền nghiệm không chứa gốc tọa độ","Miền nghiệm chứa gốc tọa độ","Miền nghiệm chỉ gồm đúng đường biên","BPT vô nghiệm"],answer:1,
          explain:"Điểm thử thỏa ⇒ nửa mặt phẳng chứa điểm đó là miền nghiệm ⇒ miền chứa \\(O\\)."},
        {level:4,title:"Thiếu vé loại 2",image:"../images/bai3/cinema.jpg",
          prompt:"Điều kiện không lỗ: \\(x+2y\\ge400\\) (đã rút gọn từ doanh thu ≥ 20 triệu; \\(x,y\\) lần lượt là số vé loại 1 và loại 2). Rạp đã bán được 80 vé loại 1. Hỏi cần bán <strong>ít nhất</strong> bao nhiêu vé loại 2 để không lỗ?",
          options:["120","140","160","200"],answer:2,
          explain:"\\(80+2y\\ge400\\Rightarrow 2y\\ge320\\Rightarrow y\\ge160\\). Vậy tối thiểu 160 vé loại 2."},
        {level:4,title:"Đúng biên hòa vốn",
          prompt:"Với điều kiện không lỗ \\(x+2y\\ge400\\) (\\(x,y\\ge0\\)), cặp nào sau đây là trường hợp <strong>hòa vốn đúng biên</strong> (doanh thu đúng 20 triệu), còn các cặp còn lại thì hoặc lỗ hoặc lãi?",
          options:["\\((100;100)\\)","\\((200;100)\\)","\\((50;180)\\)","\\((0;190)\\)"],answer:1,
          explain:"Biên: \\(x+2y=400\\). A: \\(100+200=300&lt;400\\) lỗ. B: \\(200+200=400\\) hòa vốn. C: \\(50+360=410&gt;400\\) lãi. D: \\(0+380=380&lt;400\\) lỗ."},
        {level:4,title:"Hai điều kiện",
          prompt:"Rạp cần không lỗ \\(x+2y\\ge400\\) và muốn bán vé loại 2 không quá một nửa số vé loại 1, tức \\(y\\le\\dfrac{x}{2}\\) (\\(x,y\\ge0\\)). Cặp nào thỏa <strong>đồng thời</strong> cả hai điều kiện?",
          options:["\\((200;120)\\)","\\((300;100)\\)","\\((100;200)\\)","\\((250;140)\\)"],answer:1,
          explain:"A: \\(200+240=440\\ge400\\) nhưng \\(120\\le100\\)? Sai. B: \\(300+200=500\\ge400\\) và \\(100\\le150\\) đúng. C: \\(100+400=500\\ge400\\) nhưng \\(200\\le50\\)? Sai. D: \\(250+280=530\\ge400\\) nhưng \\(140\\le125\\)? Sai."},
        {level:4,title:"Đảo chiều khi nhân âm",
          prompt:"Bắt đầu từ \\(-2x+y-4&gt;0\\). Sau khi nhân cả hai vế với \\(-1\\) (nhớ đổi chiều bất đẳng thức), bất phương trình tương đương là gì?",
          options:["\\(2x-y+4&gt;0\\)","\\(2x-y+4&lt;0\\)","\\(2x-y-4&lt;0\\)","\\(-2x+y-4&lt;0\\)"],answer:1,
          explain:"Nhân \\(-1\\): dấu &gt; đổi thành &lt;. Vế trái thành \\(2x-y+4\\). Được \\(2x-y+4&lt;0\\)."},
      ];

      let state=load(); let activeId=null;
      const mapBoard=document.getElementById("mapBoard");
      const challenge=document.getElementById("challenge");
      const chBody=document.getElementById("chBody");
      const chTitle=document.getElementById("chTitle");
      const toast=document.getElementById("toast");

      function load(){ try{const r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(_){} return {done:{},xp:0,streak:0}; }
      function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
      function firstOpen(){ for(let i=0;i<bank.length;i++) if(!state.done[i]) return i; return bank.length; }
      function status(i){ if(state.done[i]) return "done"; if(i===firstOpen()) return "current"; return "locked"; }
      function hud(){
        document.getElementById("xpVal").textContent=state.xp;
        document.getElementById("doneVal").textContent=Object.keys(state.done).length;
        document.getElementById("totalVal").textContent=bank.length;
        document.getElementById("streakVal").textContent=state.streak;
      }
      function tip(m){ toast.textContent=m; toast.classList.add("is-show"); clearTimeout(tip._t); tip._t=setTimeout(()=>toast.classList.remove("is-show"),1800); }

      function renderMap(){
        let html="";
        [1,2,3,4].forEach(lv=>{
          const items=bank.map((q,i)=>({...q,id:i})).filter(q=>q.level===lv);
          html+=`<div class="map-section"><div class="map-section__badge map-section__badge--${lv}">Suất ${lv} · ${LEVEL_LABEL[lv]}</div></div><ul class="map-path">`;
          html+=items.map(q=>{
            const st=status(q.id);
            return `<li class="map-node"><div style="position:relative">
              <button type="button" class="map-node__btn map-node__btn--cinema map-node__btn--${q.level} ${st==="done"?"is-done":st==="current"?"is-current":"is-locked"}"
                data-open="${q.id}" ${st==="locked"?"disabled":""}>${st==="locked"?"🔒":q.id+1}</button>
              <div class="map-node__label">${q.title}</div></div></li>`;
          }).join("");
          html+=`</ul><div class="map-chest"><button type="button" class="${items.every(q=>state.done[q.id])?"is-open":""}">${items.every(q=>state.done[q.id])?"🍿":"🎫"}</button></div>`;
        });
        mapBoard.innerHTML=html; hud();
      }

      function openCh(id){
        if(status(id)==="locked"){ tip("Hết vé suất này — mở mốc trước!"); return; }
        activeId=id; const q=bank[id];
        chTitle.textContent=`Suất ${id+1} · ${q.title}`;
        const img=q.image?`<img class="quiz-illust" src="${q.image}" alt=""/>`:"";
        chBody.innerHTML=`${img}<div class="level-badge level-badge--${q.level}">${LEVEL_LABEL[q.level]} · +${XP[q.level]} Vé Vàng</div>
          <p class="quiz-prompt">${q.prompt}</p>
          <div class="options">${q.options.map((o,j)=>`<label class="option"><input type="radio" name="chAns" value="${j}"/><span>${String.fromCharCode(65+j)}. ${o}</span></label>`).join("")}</div>
          <div class="quiz-result" id="chResult"></div>`;
        renderMathInElement(chBody,{delimiters:[{left:"\\(",right:"\\)",display:false}]});
        document.getElementById("chCheck").disabled=false;
        document.getElementById("chCheck").textContent="Kiểm tra";
        challenge.classList.add("is-open"); challenge.setAttribute("aria-hidden","false");
      }
      function closeCh(){ challenge.classList.remove("is-open"); challenge.setAttribute("aria-hidden","true"); activeId=null; }

      function check(){
        if(activeId==null) return;
        const q=bank[activeId], sel=chBody.querySelector('input[name="chAns"]:checked'), res=document.getElementById("chResult"), labels=chBody.querySelectorAll(".option");
        if(!sel){ res.className="quiz-result is-visible is-info"; res.textContent="Chọn đáp án đã!"; return; }
        const chosen=+sel.value;
        labels.forEach(el=>el.classList.remove("is-correct","is-wrong"));
        labels[q.answer].classList.add("is-correct");
        const ok=chosen===q.answer; if(!ok) labels[chosen].classList.add("is-wrong");
        res.className=`quiz-result is-visible ${ok?"is-ok":"is-bad"}`;
        res.innerHTML=`<strong>${ok?"Suất chiếu thành công!":"Cắt! Quay lại."}</strong> ${q.explain}`;
        renderMathInElement(res,{delimiters:[{left:"\\(",right:"\\)",display:false}]});
        chBody.querySelectorAll("input").forEach(i=>i.disabled=true);
        if(ok && !state.done[activeId]){
          state.done[activeId]=true; state.xp+=XP[q.level]; state.streak+=1; save(); tip(`+${XP[q.level]} Vé Vàng · Chuỗi ${state.streak}`); renderMap();
          document.getElementById("chCheck").disabled=true; document.getElementById("chCheck").textContent="Đã mở suất tiếp";
        } else if(!ok){
          state.streak=0; save(); hud();
          document.getElementById("chCheck").textContent="Thử lại";
          setTimeout(()=>{ if(!state.done[activeId]){
            chBody.querySelectorAll("input").forEach(i=>{i.disabled=false;i.checked=false;});
            labels.forEach(el=>el.classList.remove("is-correct","is-wrong","is-selected"));
            res.className="quiz-result"; res.innerHTML=""; document.getElementById("chCheck").textContent="Kiểm tra";
          }},1500);
        } else { document.getElementById("chCheck").disabled=true; document.getElementById("chCheck").textContent="Đã hoàn thành"; }
      }

      mapBoard.addEventListener("click",e=>{const b=e.target.closest("[data-open]"); if(b) openCh(+b.dataset.open);});
      document.getElementById("chClose").onclick=closeCh;
      document.getElementById("chSkip").onclick=closeCh;
      document.getElementById("chCheck").onclick=check;
      challenge.onclick=e=>{ if(e.target===challenge) closeCh(); };
      document.getElementById("resetProgress").onclick=()=>{ if(!confirm("Xóa tiến độ Rạp Nghiệm?")) return; state={done:{},xp:0,streak:0}; save(); renderMap(); tip("Đèn sáng — bắt đầu lại!"); };
      chBody.addEventListener("change",e=>{ if(e.target.name!=="chAns") return; chBody.querySelectorAll(".option").forEach(el=>el.classList.remove("is-selected")); e.target.closest(".option")?.classList.add("is-selected"); });
      const toggle=document.getElementById("menuToggle"), ov=document.getElementById("overlay");
      toggle?.addEventListener("click",()=>{document.body.classList.toggle("sidebar-open"); ov.hidden=!document.body.classList.contains("sidebar-open");});
      ov?.addEventListener("click",()=>{document.body.classList.remove("sidebar-open"); ov.hidden=true;});
      renderMap();
    </script>
  </body>
</html>
