                    Phủ định: “Có một số tự nhiên nhân với 1 không bằng chính nó.” → sai.
                  </div>
                </div>
                <div class="teach-media">
                  <img src="../images/sgk-forall.jpg" alt="Minh họa với mọi / tồn tại" />
                </div>
              </div>
            </div>
          `,
        },
        {
          title: "Phủ định lượng từ",
          html: `
            <div class="teach-pad">
              <span class="teach-banner teach-banner--rose">Phần 5 · Chốt kiến thức</span>
              <h2>Cách phủ định \\(\\forall\\) và \\(\\exists\\)</h2>
              <div class="teach-def">
                \\(\\overline{\\forall x,\\; P(x)} \\;=\\; \\exists x,\\; \\overline{P(x)}\\)<br />
                \\(\\overline{\\exists x,\\; P(x)} \\;=\\; \\forall x,\\; \\overline{P(x)}\\)
              </div>
              <div class="teach-parts">
                <div class="teach-part">
                  <div class="teach-part__n" style="background:#e11d48">∀</div>
                  <h3>“Mọi…”</h3>
                  <p>Phủ định → “Có ít nhất một… không…”</p>
                </div>
                <div class="teach-part">
                  <div class="teach-part__n" style="background:#2563eb">∃</div>
                  <h3>“Có ít nhất…”</h3>
                  <p>Phủ định → “Mọi… không…”</p>
                </div>
              </div>
            </div>
          `,
        },
        {
          title: "Tóm tắt",
          html: `
            <div class="teach-pad">
              <span class="teach-banner teach-banner--blue">Tổng kết</span>
              <h2>Nhớ nhanh 5 ý chính</h2>
              <div class="teach-parts">
                <div class="teach-part"><div class="teach-part__n" style="background:#2563eb">1</div><h3>Mệnh đề</h3><p>Đúng hoặc sai</p></div>
                <div class="teach-part"><div class="teach-part__n" style="background:#f97316">2</div><h3>Phủ định</h3><p>\\(\\overline{P}\\)</p></div>
                <div class="teach-part"><div class="teach-part__n" style="background:#14b8a6">3</div><h3>Kéo theo · Đảo</h3><p>\\(P \\Rightarrow Q\\)</p></div>
                <div class="teach-part"><div class="teach-part__n" style="background:#8b5cf6">4</div><h3>Tương đương</h3><p>\\(P \\Leftrightarrow Q\\)</p></div>
                <div class="teach-part"><div class="teach-part__n" style="background:#e11d48">5</div><h3>∀ · ∃</h3><p>Phủ định đổi chỗ</p></div>
              </div>
              <p class="slide-note" style="margin-top:1.25rem">
                <a class="btn btn--primary" href="bai-tap.html">Sang bài tập phân hóa →</a>
              </p>
            </div>
          `,
        },
      ];

      let index = 0;
      const answered = {};
      const body = document.getElementById("deckBody");
      const bar = document.getElementById("deckBar");
      const titleEl = document.getElementById("deckTitle");
      const indexEl = document.getElementById("deckIndex");
      const totalEl = document.getElementById("deckTotal");
      const dots = document.getElementById("deckDots");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      totalEl.textContent = String(slides.length);
      dots.innerHTML = slides
        .map((_, i) => `<button type="button" data-i="${i}" aria-label="Slide ${i + 1}"></button>`)
        .join("");

      function sameSet(a, b) {
        if (a.length !== b.length) return false;
        const sa = [...a].sort().join(",");
        const sb = [...b].sort().join(",");
        return sa === sb;
      }

      function bindQuiz(slideIndex) {
        const slide = slides[slideIndex];
        if (!slide.quiz) return;

        const optsWrap = body.querySelector("[data-quiz-options]");
        const checkBtn = body.querySelector("[data-quiz-check]");
        const resetBtn = body.querySelector("[data-quiz-reset]");
        const feedback = body.querySelector("[data-quiz-feedback]");
        if (!optsWrap || !checkBtn || !feedback) return;

        const options = [...optsWrap.querySelectorAll("[data-i]")];
        let selected = new Set(answered[slideIndex]?.selected || []);
        let locked = Boolean(answered[slideIndex]?.locked);

        function paint() {
          options.forEach((el) => {
            const i = Number(el.dataset.i);
            el.classList.toggle("is-selected", selected.has(i));
            el.classList.remove("is-correct", "is-wrong");
            if (locked) {
              el.disabled = true;
              const should = slide.quiz.correct.includes(i);
              if (should) el.classList.add("is-correct");
              else if (selected.has(i)) el.classList.add("is-wrong");
            } else {
              el.disabled = false;
            }
          });
          if (resetBtn) resetBtn.hidden = !locked;
          checkBtn.disabled = locked;
        }

        options.forEach((el) => {
          el.addEventListener("click", () => {
            if (locked) return;
            const i = Number(el.dataset.i);
            if (slide.quiz.type === "multi") {
              if (selected.has(i)) selected.delete(i);
              else selected.add(i);
            } else {
              selected = new Set([i]);
            }
            paint();
          });
        });

        checkBtn.addEventListener("click", () => {
          if (!selected.size) {
            feedback.className = "teach-feedback is-visible is-bad";
            feedback.textContent = "Hãy chọn đáp án trước đã nhé.";
            return;
          }
          locked = true;
          const ok = sameSet([...selected], slide.quiz.correct);
          answered[slideIndex] = { selected: [...selected], locked: true, ok };
          feedback.className = `teach-feedback is-visible ${ok ? "is-ok" : "is-bad"}`;
          feedback.innerHTML = `<strong>${ok ? "Chính xác!" : "Chưa đúng."}</strong> ${slide.quiz.explain}`;
          renderMathInElement(feedback, {
            delimiters: [
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true },
            ],
          });
          paint();
        });

        resetBtn?.addEventListener("click", () => {
          locked = false;
          selected = new Set();
          delete answered[slideIndex];
          feedback.className = "teach-feedback";
          feedback.innerHTML = "";
          paint();
        });

        if (locked) {
          const ok = answered[slideIndex].ok;
          feedback.className = `teach-feedback is-visible ${ok ? "is-ok" : "is-bad"}`;
          feedback.innerHTML = `<strong>${ok ? "Chính xác!" : "Chưa đúng."}</strong> ${slide.quiz.explain}`;
          renderMathInElement(feedback, {
            delimiters: [
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true },
            ],
          });
        }
        paint();
      }

      function show(i, dir = 1) {
        index = Math.max(0, Math.min(slides.length - 1, i));
        const s = slides[index];
        body.classList.remove("anim-in");
        void body.offsetWidth;
        body.innerHTML = s.html;
        body.classList.add("anim-in");
        titleEl.textContent = s.title + (s.quiz ? " · Tương tác" : "");
        indexEl.textContent = String(index + 1);
        bar.style.width = `${((index + 1) / slides.length) * 100}%`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === slides.length - 1;
        nextBtn.textContent = index === slides.length - 1 ? "Hết" : "Tiếp →";
        dots.querySelectorAll("button").forEach((b, n) => {
          b.classList.toggle("is-active", n === index);
        });
        renderMathInElement(body, {
          delimiters: [
            { left: "\\(", right: "\\)", display: false },
            { left: "\\[", right: "\\]", display: true },
          ],
        });
        bindQuiz(index);
        history.replaceState(null, "", `#${index + 1}`);
      }

      prevBtn.addEventListener("click", () => show(index - 1, -1));
      nextBtn.addEventListener("click", () => show(index + 1, 1));
      dots.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-i]");
        if (b) show(Number(b.dataset.i));
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.matches("input, textarea")) return;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") show(index + 1);
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") show(index - 1);
      });

      const hash = Number((location.hash || "").replace("#", ""));
      show(Number.isFinite(hash) && hash >= 1 ? hash - 1 : 0);

      const toggle = document.getElementById("menuToggle");
      const overlay = document.getElementById("overlay");
      function closeNav() {
        document.body.classList.remove("sidebar-open");
        overlay.hidden = true;
      }
      function openNav() {
        document.body.classList.add("sidebar-open");
        overlay.hidden = false;
      }
      toggle?.addEventListener("click", () => {
        document.body.classList.contains("sidebar-open") ? closeNav() : openNav();
      });
      overlay?.addEventListener("click", closeNav);
    </script>
  </body>
</html>
