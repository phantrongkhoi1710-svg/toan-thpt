<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>Đảo Tập Hợp — Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <link rel="stylesheet" href="../css/style.css?v=10" />
  </head>
  <body>
    <div class="overlay" id="overlay" hidden></div>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="../index.html">
          <span class="brand__mark" style="background:linear-gradient(135deg,#22d3ee,#6366f1)" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="12" r="5" /><circle cx="15" cy="12" r="5" />
            </svg>
          </span>
          Toán THPT
        </a>
        <nav>
          <p class="nav-group__label">Học tập</p>
          <ul class="nav-list">
            <li><a href="../index.html"><span class="ico">⌂</span> Trang chủ</a></li>
            <li><a href="slides.html"><span class="ico">▣</span> Slide Bài 2</a></li>
            <li><a class="is-active" href="bai-tap.html"><span class="ico">🏝</span> Đảo Tập Hợp</a></li>
            <li><a href="../bai-1-menh-de/bai-tap.html"><span class="ico">1</span> Map Bài 1</a></li>
          </ul>
        </nav>
        <div class="sidebar__foot">
          <strong>Luật đảo</strong>
          Mở mốc theo thứ tự. Đúng → nhận Ngọc Đảo (XP) và mở đảo kế.
        </div>
      </aside>

      <div class="main-col">
        <header class="topbar">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menu">☰</button>
          <label class="search"><span>⌕</span><input type="search" placeholder="Tìm mốc đảo..." /></label>
          <div class="topbar__actions">
            <a class="btn btn--ghost" href="slides.html">← Slide</a>
            <div class="avatar" style="background:linear-gradient(135deg,#22d3ee,#818cf8)">HS</div>
          </div>
        </header>

        <main class="content">
          <div class="page-head" style="margin-bottom:0.75rem">
            <h1>Đảo Tập Hợp</h1>
            <p>Challenge map riêng cho Bài 2 — khám phá 4 quần đảo kiến thức</p>
          </div>

          <div class="map-hud island-hud">
            <div class="map-stat">💎 <strong id="xpVal">0</strong> <span>Ngọc</span></div>
            <div class="map-stat">🏝 <strong id="doneVal">0</strong><span>/<span id="totalVal">0</span></span></div>
            <div class="map-stat">🌊 <strong id="streakVal">0</strong> <span>chuỗi sóng</span></div>
            <button type="button" class="btn btn--ghost" id="resetProgress">Khám phá lại</button>
          </div>

          <div class="map-board map-board--island" id="mapBoard"></div>
        </main>
      </div>
    </div>

    <div class="challenge-overlay" id="challenge" aria-hidden="true">
      <div class="challenge-panel" role="dialog" aria-modal="true">
        <div class="challenge-panel__head">
          <h2 id="chTitle">Mốc</h2>
          <button type="button" class="btn btn--ghost" id="chClose">Đóng</button>
        </div>
        <div class="challenge-panel__body" id="chBody"></div>
        <div class="challenge-panel__foot">
          <button type="button" class="btn btn--ghost" id="chSkip">Để sau</button>
          <button type="button" class="btn btn--primary" id="chCheck" style="background:linear-gradient(135deg,#06b6d4,#6366f1)">Kiểm tra</button>
        </div>
      </div>
    </div>
    <div class="map-toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script>
      const LEVEL_LABEL = { 1: "Khái niệm", 2: "Tập con", 3: "Tập số", 4: "Phép toán" };
      const XP_BY_LEVEL = { 1: 12, 2: 16, 3: 20, 4: 28 };
      const STORAGE_KEY = "toan-thpt-island-taphop-v1";

      const bank = [
        {
          level: 1, title: "Club vắng mặt",
          image: "../images/bai2/history-club.jpg",
          prompt: "Club 12 thành viên, chuyên đề 2 vắng 4 bạn. Số bạn tham gia chuyên đề 2 là?",
          options: ["4", "8", "12", "16"], answer: 1,
          explain: "12 − 4 = 8 bạn tham gia chuyên đề 2.",
        },
        {
          level: 1, title: "Tập rỗng",
          prompt: "Tập nghiệm thực của \\(x^2 + 1 = 0\\) là?",
          options: ["\\{0\\}", "\\{1, -1\\}", "\\(\\varnothing\\)", "\\(\\mathbb{R}\\)"], answer: 2,
          explain: "Phương trình vô nghiệm trên \\(\\mathbb{R}\\) → tập rỗng.",
        },
        {
          level: 1, title: "Cách mô tả",
          prompt: "Một tập hợp có thể được mô tả bởi mấy cách chính?",
          options: ["1 cách", "2 cách (liệt kê / tính chất)", "3 cách", "Không giới hạn và không phân loại"], answer: 1,
          explain: "Hai cách: liệt kê phần tử, hoặc chỉ ra tính chất đặc trưng.",
        },
        {
          level: 2, title: "Tập con hình học",
          prompt: "D = {hình vuông}, C = {hình bình hành có đường chéo ⊥}. Mệnh đề đúng?",
          options: ["\\(C \\subset D\\)", "\\(D \\subset C\\)", "\\(C = D\\)", "\\(D \\not\\subset C\\)"], answer: 1,
          explain: "Hình vuông luôn thuộc C; chiều ngược lại sai.",
        },
        {
          level: 2, title: "Tập rỗng ⊂ ?",
          prompt: "Khẳng định nào đúng?",
          options: ["\\(\\varnothing\\) không là tập con của bất kỳ tập nào", "\\(\\varnothing \\subset A\\) với mọi tập A", "\\(|\\varnothing| = 1\\)", "\\(\\varnothing = \\{0\\}\\)"], answer: 1,
          explain: "Tập rỗng là tập con của mọi tập hợp.",
        },
        {
          level: 2, title: "Hai tập bằng nhau",
          prompt: "S = T khi nào?",
          options: ["Chỉ cần \\(S \\subset T\\)", "Chỉ cần |S| = |T|", "\\(S \\subset T\\) và \\(T \\subset S\\)", "S và T giao nhau"], answer: 2,
          explain: "Hai tập bằng nhau khi mỗi cái là tập con của cái kia.",
        },
        {
          level: 3, title: "Chuỗi bao hàm",
          prompt: "Mệnh đề đúng?",
          options: ["\\(\\mathbb{R} \\subset \\mathbb{Q}\\)", "\\(\\mathbb{Z} \\subset \\mathbb{N}\\)", "\\(\\mathbb{N} \\subset \\mathbb{Z} \\subset \\mathbb{Q} \\subset \\mathbb{R}\\)", "\\(\\mathbb{Q} \\subset \\mathbb{Z}\\)"], answer: 2,
          explain: "Chuỗi bao hàm chuẩn của các tập số.",
        },
        {
          level: 3, title: "Đoạn [2;5]",
          image: "../images/bai2/sgk-3.jpg",
          prompt: "\\(x \\in [2;5]\\) tương đương?",
          options: ["\\(2 < x < 5\\)", "\\(2 \\le x < 5\\)", "\\(2 < x \\le 5\\)", "\\(2 \\le x \\le 5\\)"], answer: 3,
          explain: "Ngoặc vuông = lấy cả hai đầu mút.",
        },
        {
          level: 3, title: "Số vô tỉ",
          prompt: "Khẳng định đúng?",
          options: ["Mọi số thực đều hữu tỉ", "Tồn tại số thực không hữu tỉ", "\\(\\mathbb{Q} = \\mathbb{R}\\)", "Không có số vô tỉ"], answer: 1,
          explain: "Ví dụ \\(\\sqrt{2}\\), \\(\\pi\\) là vô tỉ.",
        },
        {
          level: 4, title: "Giao hai tập",
          image: "../images/bai2/venn-islands.jpg",
          prompt: "A = {1,2,3,4}, B = {3,4,5}. A ∩ B bằng?",
          options: ["{1,2}", "{3,4}", "{1,2,3,4,5}", "{5}"], answer: 1,
          explain: "Giao = phần tử thuộc cả hai tập: 3 và 4.",
        },
        {
          level: 4, title: "Hợp & đếm",
          prompt: "|A|=16, |B|=11, |A∪B|=24. |A∩B| bằng?",
          options: ["3", "5", "8", "27"], answer: 0,
          explain: "|A∩B| = |A|+|B|−|A∪B| = 16+11−24 = 3.",
        },
        {
          level: 4, title: "Hiệu tập hợp",
          prompt: "A∖B gồm những phần tử nào?",
          options: ["Thuộc A hoặc B", "Thuộc cả A và B", "Thuộc A nhưng không thuộc B", "Không thuộc A và không thuộc B"], answer: 2,
          explain: "Hiệu A∖B = phần tử chỉ thuộc A.",
        },
        {
          level: 4, title: "Thời tiết xấu",
          prompt: "Mưa 10, gió 8, lạnh 6; mưa∩gió 5; mưa∩lạnh 4; lạnh∩gió 3; cả ba 1. Số ngày xấu (mưa∨gió∨lạnh)?",
          options: ["10", "13", "15", "24"], answer: 1,
          explain: "|A∪B∪C| = 10+8+6 −5−4−3 +1 = 13.",
        },
      ];

      let state = loadState();
      let activeId = null;

      const mapBoard = document.getElementById("mapBoard");
      const challenge = document.getElementById("challenge");
      const chBody = document.getElementById("chBody");
      const chTitle = document.getElementById("chTitle");
      const toast = document.getElementById("toast");

      function loadState() {
        try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch (_) {}
        return { done: {}, xp: 0, streak: 0 };
      }
      function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      function firstOpen() {
        for (let i = 0; i < bank.length; i++) if (!state.done[i]) return i;
        return bank.length;
      }
      function nodeStatus(i) {
        if (state.done[i]) return "done";
        if (i === firstOpen()) return "current";
        return "locked";
      }
      function updateHud() {
        document.getElementById("xpVal").textContent = state.xp;
        document.getElementById("doneVal").textContent = Object.keys(state.done).length;
        document.getElementById("totalVal").textContent = bank.length;
        document.getElementById("streakVal").textContent = state.streak;
      }
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add("is-show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("is-show"), 1800);
      }

      function renderMap() {
        let html = "";
        [1, 2, 3, 4].forEach((lv) => {
          const items = bank.map((q, i) => ({ ...q, id: i })).filter((q) => q.level === lv);
          html += `<div class="map-section" id="sec-${lv}"><div class="map-section__badge map-section__badge--${lv}">Quần đảo ${lv} · ${LEVEL_LABEL[lv]}</div></div><ul class="map-path">`;
          html += items.map((q) => {
            const st = nodeStatus(q.id);
            return `<li class="map-node"><div style="position:relative">
              <button type="button" class="map-node__btn map-node__btn--island map-node__btn--${q.level} ${st==="done"?"is-done":st==="current"?"is-current":"is-locked"}"
                data-open="${q.id}" ${st==="locked"?"disabled":""}>${st==="locked"?"🔒":q.id+1}</button>
              <div class="map-node__label">${q.title}</div>
            </div></li>`;
          }).join("");
          html += `</ul><div class="map-chest"><button type="button" class="${items.every(q=>state.done[q.id])?"is-open":""}">${items.every(q=>state.done[q.id])?"🏝️":"🪸"}</button></div>`;
        });
        mapBoard.innerHTML = html;
        updateHud();
      }

      function openChallenge(id) {
        if (nodeStatus(id) === "locked") { showToast("Còn sóng chắn — hãy mở mốc trước!"); return; }
        activeId = id;
        const q = bank[id];
        chTitle.textContent = `Đảo ${id + 1} · ${q.title}`;
        const img = q.image ? `<img class="quiz-illust" src="${q.image}" alt="" />` : "";
        chBody.innerHTML = `${img}
          <div class="level-badge level-badge--${q.level}">${LEVEL_LABEL[q.level]} · +${XP_BY_LEVEL[q.level]} Ngọc</div>
          <p class="quiz-prompt">${q.prompt}</p>
          <div class="options" id="chOptions">
            ${q.options.map((opt,j)=>`<label class="option"><input type="radio" name="chAns" value="${j}"/><span>${String.fromCharCode(65+j)}. ${opt}</span></label>`).join("")}
          </div>
          <div class="quiz-result" id="chResult"></div>`;
        renderMathInElement(chBody, { delimiters: [{ left: "\\(", right: "\\)", display: false }] });
        document.getElementById("chCheck").disabled = false;
        document.getElementById("chCheck").textContent = "Kiểm tra";
        challenge.classList.add("is-open");
        challenge.setAttribute("aria-hidden", "false");
      }

      function closeChallenge() {
        challenge.classList.remove("is-open");
        challenge.setAttribute("aria-hidden", "true");
        activeId = null;
      }

      function checkAnswer() {
        if (activeId == null) return;
        const q = bank[activeId];
        const selected = chBody.querySelector('input[name="chAns"]:checked');
        const result = document.getElementById("chResult");
        const labels = chBody.querySelectorAll(".option");
        if (!selected) {
          result.className = "quiz-result is-visible is-info";
          result.textContent = "Chọn đáp án đã nào!";
          return;
        }
        const chosen = Number(selected.value);
        labels.forEach((el) => el.classList.remove("is-correct", "is-wrong"));
        labels[q.answer].classList.add("is-correct");
        const ok = chosen === q.answer;
        if (!ok) labels[chosen].classList.add("is-wrong");
        result.className = `quiz-result is-visible ${ok ? "is-ok" : "is-bad"}`;
        result.innerHTML = `<strong>${ok ? "Đảo mở!" : "Sóng đánh trả."}</strong> ${q.explain}`;
        renderMathInElement(result, { delimiters: [{ left: "\\(", right: "\\)", display: false }] });
        chBody.querySelectorAll("input").forEach((inp) => (inp.disabled = true));

        if (ok && !state.done[activeId]) {
          state.done[activeId] = true;
          state.xp += XP_BY_LEVEL[q.level];
          state.streak += 1;
          saveState();
          showToast(`+${XP_BY_LEVEL[q.level]} Ngọc · Chuỗi ${state.streak}`);
          renderMap();
          document.getElementById("chCheck").disabled = true;
          document.getElementById("chCheck").textContent = "Đã chiếm đảo";
        } else if (!ok) {
          state.streak = 0;
          saveState();
          updateHud();
          document.getElementById("chCheck").textContent = "Thử lại";
          setTimeout(() => {
            if (!state.done[activeId]) {
              chBody.querySelectorAll("input").forEach((inp) => { inp.disabled = false; inp.checked = false; });
              labels.forEach((el) => el.classList.remove("is-correct", "is-wrong", "is-selected"));
              result.className = "quiz-result";
              result.innerHTML = "";
              document.getElementById("chCheck").textContent = "Kiểm tra";
            }
          }, 1500);
        } else {
          document.getElementById("chCheck").disabled = true;
          document.getElementById("chCheck").textContent = "Đã chiếm đảo";
        }
      }

      mapBoard.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-open]");
        if (btn) openChallenge(Number(btn.dataset.open));
      });
      document.getElementById("chClose").addEventListener("click", closeChallenge);
      document.getElementById("chSkip").addEventListener("click", closeChallenge);
      document.getElementById("chCheck").addEventListener("click", checkAnswer);
      challenge.addEventListener("click", (e) => { if (e.target === challenge) closeChallenge(); });
      document.getElementById("resetProgress").addEventListener("click", () => {
        if (!confirm("Xóa tiến độ Đảo Tập Hợp?")) return;
        state = { done: {}, xp: 0, streak: 0 };
        saveState();
        renderMap();
        showToast("Biển êm — bắt đầu lại!");
      });
      chBody.addEventListener("change", (e) => {
        if (e.target.name !== "chAns") return;
        chBody.querySelectorAll(".option").forEach((el) => el.classList.remove("is-selected"));
        e.target.closest(".option")?.classList.add("is-selected");
      });

      const toggle = document.getElementById("menuToggle");
      const overlayNav = document.getElementById("overlay");
      toggle?.addEventListener("click", () => {
        document.body.classList.toggle("sidebar-open");
        overlayNav.hidden = !document.body.classList.contains("sidebar-open");
      });
      overlayNav?.addEventListener("click", () => {
        document.body.classList.remove("sidebar-open");
        overlayNav.hidden = true;
      });

      renderMap();
    </script>
  </body>
</html>
