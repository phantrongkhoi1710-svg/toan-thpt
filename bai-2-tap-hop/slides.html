              <div class="teach-parts">
                <div class="teach-part"><div class="teach-part__n" style="background:#06b6d4">∈</div><h3>Thuộc</h3><p>Phần tử · ∅</p></div>
                <div class="teach-part"><div class="teach-part__n" style="background:#8b5cf6">⊂</div><h3>Tập con</h3><p>Ven · bằng nhau</p></div>
                <div class="teach-part"><div class="teach-part__n" style="background:#10b981">R</div><h3>Tập số</h3><p>N⊂Z⊂Q⊂R</p></div>
                <div class="teach-part"><div class="teach-part__n" style="background:#ec4899">∪</div><h3>Phép toán</h3><p>|A∪B|=|A|+|B|−|A∩B|</p></div>
              </div>
              <p class="slide-note" style="margin-top:1.2rem">
                <a class="btn btn--primary" href="bai-tap.html" style="background:linear-gradient(135deg,#06b6d4,#6366f1)">Chinh phục Đảo Tập Hợp →</a>
              </p>
            </div>`,
        },
      ];

      let index = 0;
      const answered = {};
      const body = document.getElementById("deckBody");
      const bar = document.getElementById("deckBar");
      const titleEl = document.getElementById("deckTitle");
      const indexEl = document.getElementById("deckIndex");
      const totalEl = document.getElementById("deckTotal");
      const dots = document.getElementById("deckDots");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      totalEl.textContent = String(slides.length);
      dots.innerHTML = slides.map((_, i) => `<button type="button" data-i="${i}" aria-label="Slide ${i+1}"></button>`).join("");

      function sameSet(a, b) {
        return [...a].sort().join(",") === [...b].sort().join(",");
      }

      function bindQuiz(slideIndex) {
        const slide = slides[slideIndex];
        if (!slide.quiz) return;
        const optsWrap = body.querySelector("[data-quiz-options]") || body.querySelector(".venn-lab");
        const checkBtn = body.querySelector("[data-quiz-check]");
        const resetBtn = body.querySelector("[data-quiz-reset]");
        const feedback = body.querySelector("[data-quiz-feedback]");
        if (!checkBtn || !feedback) return;

        let selected = new Set(answered[slideIndex]?.selected || []);
        let locked = Boolean(answered[slideIndex]?.locked);

        const isVenn = slide.quiz.type === "venn";
        const options = isVenn
          ? [...body.querySelectorAll(".venn-zone[data-zone]")]
          : [...(optsWrap?.querySelectorAll("[data-i]") || [])];

        function paint() {
          if (isVenn) {
            options.forEach((el) => {
              const z = el.dataset.zone;
              el.classList.toggle("is-selected", selected.has(z));
              el.classList.remove("is-correct", "is-wrong");
              if (locked) {
                if (slide.quiz.correct.includes(z)) el.classList.add("is-correct");
                else if (selected.has(z)) el.classList.add("is-wrong");
              }
            });
          } else {
            options.forEach((el) => {
              const i = Number(el.dataset.i);
              el.classList.toggle("is-selected", selected.has(i));
              el.classList.remove("is-correct", "is-wrong");
              if (locked) {
                el.disabled = true;
                if (slide.quiz.correct.includes(i)) el.classList.add("is-correct");
                else if (selected.has(i)) el.classList.add("is-wrong");
              } else el.disabled = false;
            });
          }
          if (resetBtn) resetBtn.hidden = !locked;
          checkBtn.disabled = locked;
        }

        options.forEach((el) => {
          el.addEventListener("click", () => {
            if (locked) return;
            if (isVenn) {
              const z = el.dataset.zone;
              selected = new Set([z]);
            } else {
              const i = Number(el.dataset.i);
              if (slide.quiz.type === "multi") {
                selected.has(i) ? selected.delete(i) : selected.add(i);
              } else selected = new Set([i]);
            }
            paint();
          });
        });

        checkBtn.addEventListener("click", () => {
          if (!selected.size) {
            feedback.className = "teach-feedback is-visible is-bad";
            feedback.textContent = "Hãy chọn trước đã!";
            return;
          }
          locked = true;
          const ok = isVenn
            ? sameSet([...selected], slide.quiz.correct)
            : sameSet([...selected], slide.quiz.correct);
          answered[slideIndex] = { selected: [...selected], locked: true, ok };
          feedback.className = `teach-feedback is-visible ${ok ? "is-ok" : "is-bad"}`;
          feedback.innerHTML = `<strong>${ok ? "Chuẩn!" : "Chưa đúng."}</strong> ${slide.quiz.explain}`;
          renderMathInElement(feedback, { delimiters: [{ left: "\\(", right: "\\)", display: false }] });
          paint();
        });

        resetBtn?.addEventListener("click", () => {
          locked = false;
          selected = new Set();
          delete answered[slideIndex];
          feedback.className = "teach-feedback";
          feedback.innerHTML = "";
          paint();
        });

        if (locked) {
          const ok = answered[slideIndex].ok;
          feedback.className = `teach-feedback is-visible ${ok ? "is-ok" : "is-bad"}`;
          feedback.innerHTML = `<strong>${ok ? "Chuẩn!" : "Chưa đúng."}</strong> ${slide.quiz.explain}`;
        }
        paint();
      }

      function show(i) {
        index = Math.max(0, Math.min(slides.length - 1, i));
        const s = slides[index];
        body.classList.remove("anim-in");
        void body.offsetWidth;
        body.innerHTML = s.html;
        body.classList.add("anim-in");
        titleEl.textContent = s.title + (s.quiz ? " · Tương tác" : "");
        indexEl.textContent = String(index + 1);
        bar.style.width = `${((index + 1) / slides.length) * 100}%`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === slides.length - 1;
        nextBtn.textContent = index === slides.length - 1 ? "Hết" : "Tiếp →";
        dots.querySelectorAll("button").forEach((b, n) => b.classList.toggle("is-active", n === index));
        renderMathInElement(body, { delimiters: [{ left: "\\(", right: "\\)", display: false }, { left: "\\[", right: "\\]", display: true }] });
        bindQuiz(index);
        history.replaceState(null, "", `#${index + 1}`);
      }

      prevBtn.addEventListener("click", () => show(index - 1));
      nextBtn.addEventListener("click", () => show(index + 1));
      dots.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-i]");
        if (b) show(Number(b.dataset.i));
      });
      document.addEventListener("keydown", (e) => {
        if (e.target.matches("input, textarea")) return;
        if (e.key === "ArrowRight" || e.key === "ArrowDown") show(index + 1);
        if (e.key === "ArrowLeft" || e.key === "ArrowUp") show(index - 1);
      });

      const hash = Number((location.hash || "").replace("#", ""));
      show(Number.isFinite(hash) && hash >= 1 ? hash - 1 : 0);

      const toggle = document.getElementById("menuToggle");
      const overlayNav = document.getElementById("overlay");
      toggle?.addEventListener("click", () => {
        document.body.classList.toggle("sidebar-open");
        overlayNav.hidden = !document.body.classList.contains("sidebar-open");
      });
      overlayNav?.addEventListener("click", () => {
        document.body.classList.remove("sidebar-open");
        overlayNav.hidden = true;
      });
    </script>
  </body>
</html>
